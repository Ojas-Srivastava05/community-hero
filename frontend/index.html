<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E8773D" />
    <meta name="description" content="Community Hero — hyperlocal civic issue reporting for Indian cities" />
    <title>Community Hero | CIVICPULSE AI</title>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-splash"
        style="display:flex;min-height:100dvh;align-items:center;justify-content:center;background:#f5f0e8;font-family:system-ui,sans-serif;color:#1a1a2e"
      >
        <div style="text-align:center">
          <div
            style="width:2rem;height:2rem;margin:0 auto 0.75rem;border:3px solid #e8773d;border-top-color:transparent;border-radius:50%;animation:ch-spin 0.8s linear infinite"
          ></div>
          <p style="margin:0;font-size:0.875rem;font-weight:600">Loading Community Hero…</p>
        </div>
      </div>
      <style>
        @keyframes ch-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
